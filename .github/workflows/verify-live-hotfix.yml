name: Verify V15.8 operations
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node BOOTSTRAP_V15.mjs --prepare --force
      - run: node PWA_PATCH.mjs --apply
      - run: node V15_4_PATCH.mjs --apply
      - run: node V15_5_PATCH.mjs --apply
      - run: node V15_6_PATCH.mjs --apply
      - run: node V15_7_PATCH.mjs --apply
      - run: node V15_8_PATCH.mjs --apply
      - name: Syntax checks
        run: |
          node --check PWA_PATCH.mjs
          node --check V15_4_PATCH.mjs
          node --check V15_5_PATCH.mjs
          node --check V15_6_PATCH.mjs
          node --check V15_7_PATCH.mjs
          node --check V15_8_PATCH.mjs
          node --check server/index.mjs
          node --check server/app.v15.mjs
          node --check server/model.mjs
          node --check server/refresh.mjs
          node --check server/providers/oddspapi.mjs
          node --check public/app.js
          node --check public/mobile-app.js
      - name: Verify V15.8 markers
        run: |
          grep -q FVS_154_NOCACHE server/app.v15.mjs
          grep -q FVS_154_DAILY_MAINTENANCE server/app.v15.mjs
          grep -q "0.0.0.0" server/app.v15.mjs
          grep -q FVS_155_EXACT_FIXTURE_ODDS server/providers/oddspapi.mjs
          grep -q FVS_155_EXACT_REPRICE server/refresh.mjs
          grep -q FVS_156_SHARED_STATE server/app.v15.mjs
          grep -q FVS_156_DYNAMIC_WEIGHTS server/model.mjs
          grep -q FVS_156_FEEDBACK_GATE server/refresh.mjs
          grep -q FVS_157_VALUE_GATE server/model.mjs
          grep -q FVS_157_FORCE_FRESH_START public/app.js
          grep -q FVS_158_ODDS_THROTTLE server/providers/oddspapi.mjs
          grep -q FVS_158_ACCOUNT_CACHE server/providers/oddspapi.mjs
          grep -q FVS_158_EXACT_CACHE server/providers/oddspapi.mjs
          grep -q FVS_158_ACTIONABLE_PRIORITY server/refresh.mjs
          grep -q FVS_158_EXACT_BUDGET server/refresh.mjs
          grep -q FVS_158_REFRESH_COOLDOWN server/app.v15.mjs
          grep -q 'app.js?v=15.8.0' public/index.html
          grep -q 'style.css?v=15.8.0' public/index.html
      - name: Test exact Napoleon market mapping
        run: |
          node --input-type=module - <<'NODE'
          const {fvs155ResolveSelectionForTest}=await import('./server/providers/oddspapi.mjs');
          const mk=(price)=>({active:true,price,bookmakerChangedAt:'2026-09-21T14:00:00Z',betslip:'/test'});
          const book={markets:{101:{marketActive:true,bookmakerMarketId:'m1',outcomes:{101:{players:{a:mk(1.91)}},102:{players:{a:mk(3.55)}},103:{players:{a:mk(4.20)}}}},1010:{marketActive:true,outcomes:{1010:{players:{a:mk(2.06)}},1011:{players:{a:mk(1.78)}}}}}};
          const h=fvs155ResolveSelectionForTest(book,'1X2 · 1','home');
          const o=fvs155ResolveSelectionForTest(book,'Over/Under 2.5 · Over 2.5','over');
          if(!h.ok||h.odd!==1.91||h.outcomeId!==101)throw Error('1X2 mapping failed '+JSON.stringify(h));
          if(!o.ok||o.odd!==2.06||o.outcomeId!==1010)throw Error('O/U mapping failed '+JSON.stringify(o));
          NODE
      - name: Smoke server, shared state and maintenance
        run: |
          PORT=3106 npm start > /tmp/fvs.log 2>&1 &
          PID=$!
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:3106/health >/tmp/health.json && break; sleep 0.5; done
          cat /tmp/fvs.log
          cat /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok||x.version!=='15.8.0') process.exit(1)"
          curl -fsSI http://127.0.0.1:3106/api/dashboard | grep -qi "cache-control: no-store"
          curl -fsS http://127.0.0.1:3106/api/maintenance-status >/tmp/maint.json
          node -e "const x=require('/tmp/maint.json'); if(!x.ok) process.exit(1)"
          curl -fsS http://127.0.0.1:3106/api/user-state >/tmp/state0.json
          node -e "const x=require('/tmp/state0.json'); if(!x.ok||!Array.isArray(x.state.bets)) process.exit(1)"
          ss -ltn | grep -q ':3106'
          kill $PID || true
