name: Verify V15.4 operations
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node BOOTSTRAP_V15.mjs --prepare --force
      - run: node PWA_PATCH.mjs --apply
      - run: node V15_4_PATCH.mjs --apply
      - name: Syntax checks
        run: |
          node --check PWA_PATCH.mjs
          node --check V15_4_PATCH.mjs
          node --check server/index.mjs
          node --check server/app.v15.mjs
          node --check server/refresh.mjs
          node --check public/app.js
          node --check public/mobile-app.js
      - name: Verify V15.4 operational patches
        run: |
          grep -q FVS_1531_FRESHNESS server/app.v15.mjs
          grep -q FVS_1531_ROW_FILTER server/refresh.mjs
          grep -q FVS_1531_LIVE_REFRESH public/app.js
          grep -q FVS_154_NOCACHE server/app.v15.mjs
          grep -q FVS_154_DAILY_MAINTENANCE server/app.v15.mjs
          grep -q "0.0.0.0" server/app.v15.mjs
          grep -q FVS_154_PLAYABLE_DIAGNOSTICS public/app.js
          grep -q FVS_154_MOBILE_RESUME public/app.js
          grep -q FVS_154_UNREGISTER_STALE_SW public/mobile-app.js
          grep -q "mobile-app.js?v=15.4.0" public/index.html
      - name: Smoke server and no-cache API
        run: |
          PORT=3106 npm start > /tmp/fvs.log 2>&1 &
          PID=$!
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3106/health >/tmp/health.json && break; sleep 0.5; done
          cat /tmp/fvs.log
          cat /tmp/health.json
          curl -fsSI http://127.0.0.1:3106/api/dashboard | grep -qi "cache-control: no-store"
          curl -fsS http://127.0.0.1:3106/api/maintenance-status >/tmp/maint.json
          node -e "const x=require('/tmp/maint.json'); if(!x.ok) process.exit(1); console.log('maintenance route ok')"
          ss -ltn | grep -q ':3106'
          kill $PID || true
