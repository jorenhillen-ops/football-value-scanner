name: Inspect live refresh
on:
  push:
    branches: [inspect-live-refresh]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runtime
        run: node BOOTSTRAP_V15.mjs --prepare --force
      - name: Show refresh and fixture endpoints
        run: |
          echo '--- server routes ---'
          grep -RniE "app\.(get|post)|router\.(get|post)|refresh|live|fixture|odds" server/app.v15.mjs server/refresh.mjs server/providers/*.mjs | head -n 400 || true
          echo '--- client refresh hooks ---'
          grep -RniE "refresh|live|fixture|odds|today|vandaag|fetch\(" public/app.js public/index.html | head -n 500 || true
