name: Inspect live refresh
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runtime
        run: node BOOTSTRAP_V15.mjs --prepare --force
      - name: Show exact refresh code
        run: |
          echo '--- refresh.mjs ---'
          sed -n '1,360p' server/refresh.mjs
          echo '--- refresh endpoint ---'
          sed -n '245,275p' server/app.v15.mjs
          echo '--- OddsPapi day fetch ---'
          sed -n '255,370p' server/providers/oddspapi.mjs
