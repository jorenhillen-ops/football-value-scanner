name: Inspect live refresh
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runtime
        run: node BOOTSTRAP_V15.mjs --prepare --force
      - name: Show server listen configuration
        run: |
          echo '--- listen configuration ---'
          grep -RniE "listen\(|HOST|0\.0\.0\.0|localhost|127\.0\.0\.1" server/app.v15.mjs server/*.mjs | tail -n 120 || true
          echo '--- app tail ---'
          tail -n 50 server/app.v15.mjs
