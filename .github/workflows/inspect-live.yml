name: Inspect live refresh
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runtime
        run: node BOOTSTRAP_V15.mjs --prepare --force
      - name: Inspect data and playable logic
        run: |
          echo '--- OddsPapi filters ---'
          sed -n '1,95p' server/providers/oddspapi.mjs
          echo '--- model evaluation ---'
          grep -nE "function evaluate1x2|export function evaluate1x2|status.*BET|VOORWAARDELIJK|stakePct|MIN" server/model.mjs | head -n 160 || true
          echo '--- app club sync ---'
          sed -n '105,195p' server/app.v15.mjs
          echo '--- client playable render ---'
          grep -nE "playable|Speelbare|actionable|opportunities|BET|VOORWAARDELIJK" public/app.js | head -n 240 || true
