name: Inspect live refresh
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runtime
        run: node BOOTSTRAP_V15.mjs --prepare --force
      - name: Inspect odds/model internals
        run: |
          echo '--- OddsPapi market definitions + verify ---'
          sed -n '1,270p' server/providers/oddspapi.mjs
          echo '--- model evaluation core ---'
          grep -nE "evaluate1x2|evaluateMarketCandidate|VOORWAARDELIJK|BET|stakePct|value" server/model.mjs | head -n 260 || true
          echo '--- refresh row build ---'
          sed -n '205,320p' server/refresh.mjs
