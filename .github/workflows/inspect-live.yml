name: Inspect live refresh
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runtime
        run: node BOOTSTRAP_V15.mjs --prepare --force
      - name: Apply current patches
        run: |
          node PWA_PATCH.mjs --apply
          node V15_4_PATCH.mjs --apply
          node V15_5_PATCH.mjs --apply
          node V15_6_PATCH.mjs --apply
          node V15_7_PATCH.mjs --apply
      - name: Inspect OddsPapi throttling and maintenance
        run: |
          echo '--- oddspapi request core ---'
          sed -n '1,120p' server/providers/oddspapi.mjs
          echo '--- oddspapi day fetch ---'
          sed -n '255,390p' server/providers/oddspapi.mjs
          echo '--- maintenance/server schedule ---'
          grep -nE "FVS_154_DAILY_MAINTENANCE|fvsRunDailyMaintenance|setInterval|app.listen|/api/refresh|maintenance-now" server/app.v15.mjs | head -n 200 || true
          echo '--- refresh freshness/exact ---'
          grep -nE "FVS_155_EXACT_REPRICE|fetchNapoleonDay|stale|localDateISO|actionable|maxFixtures" server/refresh.mjs | head -n 240 || true
